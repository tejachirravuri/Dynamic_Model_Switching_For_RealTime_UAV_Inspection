[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-thesis"
version = "0.1.0"
description = "Dynamic Model Switching for Real-Time UAV Inspection"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Detector backend — needed to run the experiment pipeline (pulls torch).
infer = [
    "ultralytics>=8.0.0",
]
# Result analysis and figure generation.
analysis = [
    "pandas>=1.5",
    "matplotlib>=3.6",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
# Learned-policy comparisons (lr_policy, rf_policy).
ml = [
    "scikit-learn>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dms*"]
exclude = ["tests*", "experiments*", "analysis*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
